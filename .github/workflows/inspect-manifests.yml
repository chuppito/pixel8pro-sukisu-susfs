name: Inspect kernel manifests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect candidate Google manifest XML
        run: python3 scripts/inspect_manifests.py | tee manifest-inspection.txt
      - uses: actions/upload-artifact@v4
        with:
          name: husky-manifest-inspection
          path: manifest-inspection.txt
          retention-days: 14
